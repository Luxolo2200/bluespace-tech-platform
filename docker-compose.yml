version: '3.8'

services:
  # --- Database Persistence ---
  postgres:
    image: postgres:16-alpine
    container_name: bluespace-postgres
    restart: always
    environment:
      POSTGRES_DB: bluespace_db
      POSTGRES_USER: bluespace_user
      POSTGRES_PASSWORD: bluespace_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluespace_user -d bluespace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Cache & Session Store ---
  redis:
    image: redis:7-alpine
    container_name: bluespace-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Core Application Monolith ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluespace-app
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bluespace_db
      SPRING_DATASOURCE_USERNAME: bluespace_user
      SPRING_DATASOURCE_PASSWORD: bluespace_secure_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- Internal Reverse Proxy ---
  nginx:
    image: nginx:alpine
    container_name: bluespace-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data: