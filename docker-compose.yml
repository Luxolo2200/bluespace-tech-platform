version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bluespace-postgres
    environment:
      POSTGRES_DB: bluespace_db
      POSTGRES_USER: bluespace_user
      POSTGRES_PASSWORD: bluespace_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bluespace_user -d bluespace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bluespace-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bluespace-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bluespace_db
      SPRING_DATASOURCE_USERNAME: bluespace_user
      SPRING_DATASOURCE_PASSWORD: bluespace_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy