name: Generate Architecture Diagrams

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  export-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Structurizr CLI
        run: |
          wget https://github.com/structurizr/cli/releases/download/v2024.03.03/structurizr-cli.zip
          unzip structurizr-cli.zip -d structurizr-cli

      - name: Create Output Directory
        run: mkdir -p docs/architecture/diagrams

      - name: Export Diagrams
        run: |
          ./structurizr-cli/structurizr.sh export \
            -workspace docs/architecture/workspace.dsl \
            -format mermaid \
            -output docs/architecture/diagrams

      - name: Verify Diagrams Output
        run: ls -la docs/architecture/diagrams/

      - name: Commit and Push Diagrams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/architecture/diagrams/*.mmd
          git commit -m "chore(docs): auto-generate updated mermaid diagrams" || echo "No changes to commit"
          git push origin main