name: Generate Architecture Diagrams

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  export-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Output Directory
        run: mkdir -p docs/architecture/diagrams

      - name: Export Diagrams via Structurizr CLI
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/local/structurizr \
            -w /usr/local/structurizr \
            structurizr/cli export \
            -workspace docs/architecture/workspace.dsl \
            -format mermaid \
            -output docs/architecture/diagrams

      - name: Commit and Force-Push Diagrams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/architecture/diagrams/
          git commit -m "chore(docs): auto-generate updated mermaid diagrams" || echo "No changes to commit"
          git push origin main