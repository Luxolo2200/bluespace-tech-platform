name: Generate Architecture Diagrams

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/architecture/workspace.dsl'
      - '.github/workflows/diagrams.yml'

permissions:
  contents: write

jobs:
  export-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Output Directory
        run: mkdir -p docs/architecture/diagrams

      - name: Run Structurizr CLI via Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/usr/local/structurizr structurizr/cli export -workspace docs/architecture/workspace.dsl -format mermaid -output docs/architecture/diagrams

      - name: Commit and Push Mermaid Outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/diagrams/
          git status
          git diff-index --quiet HEAD || (git commit -m "chore(docs): auto-generate updated mermaid diagrams" && git push)