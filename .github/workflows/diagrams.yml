name: Generate Architecture Diagrams

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  export-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create Output Directory
        run: mkdir -p docs/architecture/diagrams

      - name: Export Diagrams via Structurizr CLI
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/local/structurizr \
            structurizr/cli export \
            -workspace /usr/local/structurizr/docs/architecture/workspace.dsl \
            -format mermaid \
            -output /usr/local/structurizr/docs/architecture/diagrams

      - name: Verify Output Directory
        run: ls -la docs/architecture/diagrams/

      - name: Commit and Push Diagrams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/architecture/diagrams/
          git diff-index --quiet HEAD || (git commit -m "chore(docs): auto-generate updated mermaid diagrams" && git push)