name: Generate Architecture Diagrams

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/architecture/workspace.dsl'
      - '.github/workflows/diagrams.yml'

permissions:
  contents: write

jobs:
  export-diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Create Output Directory
        run: mkdir -p docs/architecture/diagrams

      - name: Run Structurizr CLI via Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/usr/local/structurizr \
            structurizr/cli export \
            -w docs/architecture/workspace.dsl \
            -f mermaid \
            -o docs/architecture/diagrams

      - name: Check Generated Files
        run: ls -la docs/architecture/diagrams/

      - name: Commit and Push Mermaid Outputs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/diagrams/
          git diff-index --quiet HEAD || (git commit -m "chore(docs): auto-generate updated mermaid diagrams" && git push)