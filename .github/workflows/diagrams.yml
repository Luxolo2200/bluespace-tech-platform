name: Render Architecture Diagrams

on:
  push:
    paths:
      - 'docs/architecture/workspace.dsl'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Structurizr CLI and Mermaid CLI
        run: |
          npm install -g @mermaid-js/mermaid-cli
          wget https://github.com/structurizr/cli/releases/download/v2024.03.03/structurizr-cli.zip
          unzip structurizr-cli.zip -d structurizr
          chmod +x structurizr/structurizr.sh

      - name: Export Structurizr DSL to Mermaid
        run: |
          ./structurizr/structurizr.sh export -w docs/architecture/workspace.dsl -f mermaid -o docs/architecture/diagrams

      - name: Create Puppeteer Config
        run: |
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteerConfig.json

      - name: Render High-Resolution PNGs
        run: |
          for f in docs/architecture/diagrams/*.mmd; do
            mmdc -i "$f" -o "${f%.mmd}.png" --scale 3 -p puppeteerConfig.json --backgroundColor transparent
          done

      - name: Commit and Push Rendered Diagrams
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/diagrams/*.png docs/architecture/diagrams/*.mmd
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(docs): render high-resolution architecture diagrams [skip ci]" && git push)